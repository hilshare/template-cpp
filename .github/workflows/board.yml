name: Board

# This workflow builds the TAB on a hosted runner and runs it on a physical board through the
# HILShare service. The job needs no secret.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its queued job. A job that does not start uses no run.
concurrency:
  group: board-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: board

jobs:
  board:
    name: board
    runs-on: ubuntu-24.04
    # 20 minutes for the build, 60 for the queue and 12 for a job on the board.
    timeout-minutes: 92
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # libtock-c selects its precompiled newlib and libc++ from the major version of this
      # compiler. Ubuntu 24.04 gives GCC 13.
      - name: Arm toolchain
        run: sudo apt-get update && sudo apt-get install --yes gcc-arm-none-eabi
      - name: Restore elf2tab
        id: elf2tab
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/elf2tab
          key: elf2tab-0.13.0-ubuntu-24.04
      - name: elf2tab
        if: ${{ steps.elf2tab.outputs.cache-hit != 'true' }}
        run: cargo install elf2tab --version 0.13.0 --locked
      # libtock-c downloads about 300 MB of newlib and libc++ into this directory.
      - name: Restore the dependencies
        uses: actions/cache@v6
        with:
          path: board/third-party
          key: third-party-${{ hashFiles('board/fetch-dependencies.sh') }}
      - name: Build the TAB
        run: ./fetch-dependencies.sh && make
      # The ELF turns the `pc` of a fault into a source line.
      - name: Upload the ELF
        uses: actions/upload-artifact@v7
        with:
          name: my-app-elf
          path: board/build/cortex-m4/cortex-m4.elf
          retention-days: 7
      # A pull request from a fork or from Dependabot gets no OIDC token. The job stays green with
      # the build alone, and the app gets its board run after the merge.
      - name: Run on the board
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') }}
        uses: hilshare/action@v1
        with:
          app: board/build/my-app.tab
          board: nucleo-f411re
